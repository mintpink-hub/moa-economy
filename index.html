<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moa Economy ♡</title><style>
:root{--pink:#cf839c;--ink:#4f414a;--muted:#947b87;--line:#f0dce4;--bg:#fff7f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}button,a{font:inherit}button{cursor:pointer}a{color:#a65c7c}.shell{max-width:950px;margin:auto;padding:26px 18px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.logo{font-weight:900;font-size:26px;color:#ac6481}.sub{font-size:12px;color:var(--muted)}.pill{padding:9px 14px;background:white;border:1px solid var(--line);border-radius:999px;color:#a46780}.hero{text-align:center;padding:48px 12px 27px}.eyebrow{color:#b27d92;font-size:13px;letter-spacing:2px}.hero h1{font-size:clamp(28px,5vw,43px);margin:12px 0;color:#86576b}.hero p{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:23px;padding:clamp(20px,4vw,38px);box-shadow:0 14px 40px #b77b9112}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}.tag{background:#ffedf3;color:#a96280;padding:6px 10px;border-radius:999px;font-weight:700}.article-title{font-size:clamp(24px,4vw,33px);line-height:1.3;margin:20px 0 7px}.ko-title{color:#a66b84;margin:0 0 24px;font-size:17px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.controls button,.action{background:white;border:1px solid #eacbd8;border-radius:12px;padding:10px 13px;color:#985b77;text-decoration:none}.controls button.active,.action.primary{background:var(--pink);color:white;border-color:var(--pink)}.sentence{padding:17px 0;border-top:1px solid #f6eaf0;line-height:1.8}.en{font-size:17px}.ko{color:#9e7184;margin-top:7px;font-size:14px}.hide{display:none}.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.word{padding:15px;border:1px solid var(--line);border-radius:14px;background:#fffafd}.word strong{color:#a55d7c}.word span{display:block;color:var(--muted);margin-top:7px;font-size:13px}.section-title{font-size:19px;color:#915b72;margin:35px 0 16px}.quiz{padding:18px 0;border-top:1px solid var(--line)}.quiz p{font-weight:700}.choice{display:block;width:100%;margin:8px 0;text-align:left;padding:12px;border:1px solid var(--line);background:#fff;border-radius:11px;color:var(--ink)}.choice.correct{background:#eaf7ef;border-color:#94c6a5}.choice.wrong{background:#fff0f1;border-color:#e6a5b0}.feedback{font-size:13px;color:#8e6d7c}.bottom{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{text-align:center;padding:10px 0;color:#a77d90;font-size:12px}.date{min-height:65px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink)}.date:disabled{opacity:.35;cursor:default}.date.studied{background:#fff0f5;border-color:#d99bb1}.date.selected{outline:2px solid #cc829d}.date small{font-size:15px}.empty{padding:30px 12px;text-align:center;color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.8}.footer{text-align:center;color:#b18b9b;margin-top:40px;font-size:12px}@media(max-width:550px){.hero{padding-top:32px}.date{min-height:48px}.date small{font-size:12px}}
</style></head><body><main class="shell"><header class="top"><div><div class="logo">✿ Moa Economy ♡</div><div class="sub">하루 한 기사, 조금씩 성장하는 경제 영어</div></div><button class="pill" id="todayBtn">🌷 오늘의 뉴스</button></header><section class="hero"><div class="eyebrow">ONE ARTICLE A DAY</div><h1 id="heading">오늘의 경제 영어 뉴스 ♡</h1><p>딱 한 기사만, 영어와 경제를 천천히 배워요.</p></section><section class="card" id="article"><div class="empty">뉴스를 불러오는 중이에요…</div></section><h2 class="section-title">🌸 나의 공부 달력</h2><section class="card"><div class="top"><strong id="monthTitle"></strong><div><button class="pill" id="prevMonth">‹</button> <button class="pill" id="nextMonth">›</button></div></div><div class="calendar" id="calendar"></div><p class="note">♡ 표시가 있는 날은 학습 완료한 날이에요. 날짜를 누르면 지난 기사를 다시 볼 수 있어요. 학습 기록은 이 브라우저에 저장돼요.</p></section><div class="footer">Moa Economy ♡ · 무료 공개 기사 링크와 학습용 재구성 콘텐츠</div></main><script>
const $=id=>document.getElementById(id), kst=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());let entries=[],current=null,mode='both',month=new Date(kst()+'T12:00:00');const completed=()=>{try{return JSON.parse(localStorage.getItem('moa-economy-completed')||'{}')}catch{return {}}};function complete(date){const x=completed();x[date]=true;localStorage.setItem('moa-economy-completed',JSON.stringify(x));drawCalendar();render()};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};function render(){const a=current,box=$('article');if(!a){box.innerHTML='<div class="empty">오늘의 기사가 아직 준비되지 않았어요. 자동 업데이트 설정을 확인해 주세요 ♡</div>';return}const done=!!completed()[a.date];$('heading').textContent=a.date===kst()?'오늘의 경제 영어 뉴스 ♡':'지난 경제 영어 뉴스 ♡';box.innerHTML=`<div class="meta"><span class="tag">${a.date===kst()?'TODAY':'ARCHIVE'}</span><span>${esc(a.date)}</span><span>·</span><span>${esc(a.source)}</span><span>·</span><span>약 10분</span></div><h2 class="article-title">${esc(a.title_en)}</h2><p class="ko-title">${esc(a.title_ko)}</p><div class="controls"><button data-mode="both" class="${mode==='both'?'active':''}">영어 + 해석</button><button data-mode="english" class="${mode==='english'?'active':''}">영어만</button><button data-mode="hidden" class="${mode==='hidden'?'active':''}">해석 가리기</button></div><div id="sentences">${a.sentences.map((s,i)=>`<div class="sentence"><div class="en">${i+1}. ${esc(s.en)} <button class="pill" data-speak="${i}" title="영어 듣기">🔊</button></div><div class="ko ${mode==='english'||mode==='hidden'?'hide':''}">${esc(s.ko)}</div>${mode==='hidden'?`<button class="pill" data-reveal="${i}">해석 보기</button>`:''}</div>`).join('')}</div><h3 class="section-title">🎀 오늘의 핵심 단어 5개</h3><div class="words">${a.words.map(w=>`<div class="word"><strong>${esc(w.en)}</strong><span>${esc(w.ko)}</span></div>`).join('')}</div><h3 class="section-title">✏️ 이해도 퀴즈 3문제</h3><div id="quizzes">${a.quiz.map((q,i)=>`<div class="quiz"><p>${i+1}. ${esc(q.question)}</p>${q.options.map((o,j)=>`<button class="choice" data-q="${i}" data-choice="${j}">${esc(o)}</button>`).join('')}<div class="feedback" id="feedback${i}"></div></div>`).join('')}</div><div class="bottom"><a class="action primary" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">↗ 무료 원문 기사 읽기</a><button class="action" id="complete">${done?'✓ 오늘 공부 완료':'♡ 오늘 공부 완료하기'}</button></div><p class="note">기사 전문을 복제하지 않고 학습용으로 재구성했어요. 원문은 언론사 페이지에서 확인해 주세요.${a.demo?' · 현재 표시된 내용은 기능 확인용 예시입니다.':''}</p>`;box.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});box.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{b.previousElementSibling.classList.toggle('hide');b.textContent=b.previousElementSibling.classList.contains('hide')?'해석 보기':'해석 숨기기'});box.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>{if(!('speechSynthesis'in window))return alert('이 브라우저에서는 음성을 지원하지 않아요.');speechSynthesis.cancel();const s=new SpeechSynthesisUtterance(a.sentences[+b.dataset.speak].en);s.lang='en-US';s.rate=.85;speechSynthesis.speak(s)});box.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const i=+b.dataset.q,j=+b.dataset.choice,q=a.quiz[i],parent=b.parentElement;parent.querySelectorAll('[data-choice]').forEach(x=>{x.disabled=true;x.classList.add(+x.dataset.choice===q.answer?'correct':+x.dataset.choice===j?'wrong':'')});$('feedback'+i).textContent=(j===q.answer?'정답이에요! ♡ ':'다시 기억해 봐요. ')+q.explanation});$('complete').onclick=()=>complete(a.date)}function drawCalendar(){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();$('monthTitle').textContent=`${y}년 ${m+1}월`;$('calendar').innerHTML=['일','월','화','수','목','금','토'].map(d=>`<div class="day">${d}</div>`).join('')+Array(first).fill('<div></div>').join('')+Array.from({length:days},(_,i)=>{const d=`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,has=entries.some(x=>x.date===d);return `<button class="date ${completed()[d]?'studied':''} ${current?.date===d?'selected':''}" data-date="${d}" ${has?'':'disabled'}>${i+1}<small>${completed()[d]?'♡':has?'•':''}</small></button>`}).join('');$('calendar').querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{current=entries.find(a=>a.date===b.dataset.date);render();drawCalendar();$('article').scrollIntoView({behavior:'smooth'})})}function valid(a){return a&&typeof a.date==='string'&&typeof a.url==='string'&&Array.isArray(a.sentences)&&a.sentences.length>=5&&Array.isArray(a.words)&&a.words.length===5&&Array.isArray(a.quiz)&&a.quiz.length===3}async function load(){try{const r=await fetch('news.json?cache='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();entries=(data.articles||[]).filter(valid).sort((a,b)=>b.date.localeCompare(a.date));current=entries.find(a=>a.date===kst())||entries[0]||null}catch{entries=[];current=null}render();drawCalendar()}$('todayBtn').onclick=()=>{current=entries.find(a=>a.date===kst())||entries[0]||null;month=new Date(kst()+'T12:00:00');render();drawCalendar()};$('prevMonth').onclick=()=>{month.setMonth(month.getMonth()-1);drawCalendar()};$('nextMonth').onclick=()=>{month.setMonth(month.getMonth()+1);drawCalendar()};load();
</script></body></html>
