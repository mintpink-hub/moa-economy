name: Daily Moa Economy News
on:
  schedule:
    - cron: '10 23 * * *' # 08:10 Asia/Seoul (UTC+9)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  daily-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenAI SDK
        run: python -m pip install 'openai>=1.0,<3'
      - name: Create daily lesson
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python update_news.py
      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily economy lesson"
            git push
          fi
