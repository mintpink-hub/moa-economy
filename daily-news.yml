name: Daily BBC economy article
on:
  schedule:
    - cron: '10 23 * * *' # 08:10 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch BBC RSS (no API key)
        run: python update_news.py
      - name: Commit news archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update BBC economy news"
            git push
          fi
